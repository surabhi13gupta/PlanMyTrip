# Local PostgreSQL for development and tests (backend-spec §14).
#   docker compose up -d db     start
#   docker compose down         stop (data kept)
#   docker compose down -v      stop and delete all data
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: planmytrip
      POSTGRES_PASSWORD: planmytrip
      POSTGRES_DB: planmytrip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planmytrip"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
